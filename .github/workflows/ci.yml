# CI: main 宛ての PR と main への push で lint・テスト・秘密情報チェックを実行
# ジョブ名 "ci" をブランチ保護の必須チェックに登録する
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ↓ プロジェクトの言語に合わせて変更（例は Node.js）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

      # 秘密情報の混入チェック
      - name: Secret file check
        run: |
          if git ls-files | grep -Eq '(^|/)\.env($|\.)|\.pem$|\.key$|^secrets/'; then
            echo "::error::秘密情報ファイルがコミットされています"; exit 1
          fi
